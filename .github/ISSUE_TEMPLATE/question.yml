name: Question
description: Ask a question about AI Agent Platform
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Have a question? We're here to help!

  - type: textarea
    id: question
    attributes:
      label: Your Question
      description: What would you like to know?
      placeholder: How do I...?
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: What is your question about?
      options:
        - "Installation & Setup"
        - "Configuration"
        - "Usage & Features"
        - "API & Integration"
        - "Performance"
        - "Troubleshooting"
        - "Architecture & Design"
        - "Contributing"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Provide any additional context that might help answer your question
      placeholder: I'm trying to... and I've already tried...

  - type: textarea
    id: attempted
    attributes:
      label: What Have You Tried?
      description: Have you tried anything to solve this yourself?
      placeholder: I've looked at the docs..., I've tried...

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues and discussions
          required: true
        - label: I have checked the documentation
          required: true
